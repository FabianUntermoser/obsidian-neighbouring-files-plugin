name: Release Obsidian plugin

on:
    push:
        tags:
            - "*"

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            id-token: write
            attestations: write

        env:
            # every file the plugin ships; the verify step and the release
            # command both read this so they can not drift apart
            RELEASE_FILES: "main.js,manifest.json,styles.css"

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                persist-credentials: false

            - name: Use Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: "22.x"
                  package-manager-cache: false

            - name: Build plugin
              run: |
                  npm install
                  npm run build
                  npm run test

            - name: Verify release assets
              run: |
                  # every file the plugin ships must exist in the build;
                  # RELEASE_FILES is the single source of truth for the release
                  IFS=',' read -r -a release_files <<< "$RELEASE_FILES"
                  for f in "${release_files[@]}"; do
                      test -s "$f" || { echo "error: $f missing or empty"; exit 1; }
                  done
                  echo "all release assets present"

            - name: Attest build artifacts
              uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.1.1
              with:
                  subject-path: ${{ env.RELEASE_FILES }}

            - name: Create release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  tag="${GITHUB_REF#refs/tags/}"
                  IFS=',' read -r -a release_files <<< "$RELEASE_FILES"

                  gh release create "$tag" --title "$tag" --generate-notes --draft "${release_files[@]}"
